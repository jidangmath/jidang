<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지당 징검다리 · 교사용</title>
<style>
:root{--bg:#EEF9FB;--surface:#fff;--ink:#17323B;--muted:#58757E;--water:#0A7F8F;--soft:#D6F2F5;--lamp:#FFC83D;--pop:#FF7A59;--line:#D5EAEE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'IBM Plex Sans KR',system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.muted{color:var(--muted);font-size:14px}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--water);color:#fff;font-weight:700;cursor:pointer;min-height:44px}
button.ghost{background:var(--soft);color:var(--water)}button.warn{background:var(--pop)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:26px;font-weight:700;color:var(--water)}.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;background:var(--soft);color:var(--water);margin-right:4px}
.tag.p{background:#FFE9E2;color:#B8431F}.tag.g{background:#F1F5F6;color:var(--muted)}
.st{border-top:1px solid var(--line);padding:10px 0}.st:first-child{border-top:0}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
</style></head><body>
<h1>지당 징검다리 · 교사용</h1>
<p class="muted">학생이 보낸 보고 코드를 붙여 넣으면 한눈에 볼 수 있어요. 코드에는 별명과 기록한 날 수, 쿠폰 상태만 있고 글 내용은 없어요. 이 기기 안에만 저장돼요.</p>
<div class="card"><h2>보고 코드 붙여 넣기</h2>
<textarea id="in" placeholder="JD1.로 시작하는 코드를 여러 개 붙여 넣어도 돼요 (줄바꿈으로 구분)" aria-label="보고 코드"></textarea>
<div class="row"><button id="add">반영하기</button><button class="ghost" id="csv">표로 내려받기(CSV)</button><button class="ghost warn" id="clr" style="color:#fff">전체 지우기</button></div><p class="muted" id="msg" role="status"></p></div>
<details class="card" id="cfg"><summary><b>구글 시트 연결</b></summary>
<p class="muted">시트에서 자동으로 불러오려면 아래를 채워 주세요. 이 기기에만 저장돼요.</p>
<label for="su">웹 앱 주소</label><input id="su" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit" placeholder="https://script.google.com/macros/s/.../exec">
<label for="sk" style="display:block;margin-top:8px">선생님 비밀 키</label><input id="sk" type="password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit">
<label for="sc" style="display:block;margin-top:8px">반 코드 (학생 링크용)</label><input id="sc" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit">
<div class="row"><button id="ssave" class="ghost">저장</button><button id="sload">시트에서 불러오기</button><button id="slink" class="ghost">학생 링크 만들기</button></div>
<p class="muted" id="smsg" role="status"></p><textarea id="sout" hidden readonly aria-label="학생 링크" style="min-height:60px"></textarea></details>
<div id="sum"></div><div id="cp"></div><div id="list"></div>
<script>
const LS='jidang.teacher.v1';let D={st:{},ok:{}};
try{D=Object.assign(D,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const gap=k=>k?Math.round((new Date(today())-new Date(k))/864e5):999;
const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function dec(c){try{if(!c.startsWith('JD1.'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));if(!o||typeof o.n!=='string'||typeof o.r!=='number')return null;return o}catch(e){return null}}
$('#add').onclick=()=>{
  const parts=$('#in').value.split(/\s+/).filter(Boolean);let okn=0,bad=0;
  for(const p of parts){const o=dec(p);if(!o){bad++;continue}const k=o.n+'|'+o.s;if(!D.st[k]||D.st[k].t<=o.t){D.st[k]=o}okn++}
  save();$('#in').value='';$('#msg').textContent=okn+'개 반영했어요.'+(bad?` 읽을 수 없는 코드 ${bad}개는 건너뛰었어요.`:'');draw();
};
$('#clr').onclick=()=>{if(confirm('이 기기에 저장된 학생 기록을 모두 지울까요?')){D={st:{},ok:{}};save();draw()}};
$('#csv').onclick=()=>{
  const rows=[['별명','기록한 날','연속','최장 연속','칭호','퀘스트','최근 에너지','마지막 기록','보고 시각']];
  Object.values(D.st).forEach(o=>rows.push([o.n,o.r,o.st,o.lg,o.lv,o.q,o.e,o.l,fmt(o.t)]));
  const b=new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='지당_현황.csv';a.click();
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ok]');if(!b)return;
  const k=b.dataset.ok;D.ok[k]=D.ok[k]?0:Date.now();save();draw();
});
function draw(){
  const L=Object.values(D.st).sort((a,b)=>b.r-a.r);
  if(!L.length){$('#sum').innerHTML='';$('#cp').innerHTML='';$('#list').innerHTML='<div class="card muted">아직 반영된 학생이 없어요.</div>';return}
  const tot=L.reduce((a,o)=>a+o.r,0),act=L.filter(o=>gap(o.l)<=2).length,rest=L.filter(o=>gap(o.l)>=3);
  $('#sum').innerHTML=`<div class="card"><h2>우리 반 한눈에</h2><div class="grid"><div><div class="big">${L.length}</div><div class="muted">학생 수</div></div><div><div class="big">${tot}</div><div class="muted">기록한 날 합계</div></div><div><div class="big">${act}</div><div class="muted">최근 2일 안에 기록</div></div></div>${rest.length?`<p class="muted" style="margin-top:10px">3일 이상 쉬고 있는 학생: <b>${rest.map(o=>esc(o.n)).join(', ')}</b> — 혼내기보다 안부를 먼저 물어봐 주세요.</p>`:''}</div>`;
  const pend=[];L.forEach(o=>(o.c||[]).forEach(c=>pend.push({o,d:c[0],sn:c[1],iss:c[2],used:c[3]})));
  const key=p=>p.o.n+'|'+p.sn;
  $('#cp').innerHTML=pend.length?`<div class="card"><h2>쿠폰</h2>${pend.map(p=>`<div class="st"><b>${esc(p.o.n)}</b> · ${p.d}일 쿠폰 <span class="muted">${esc(p.sn)}</span><br><span class="tag ${p.used?'g':'p'}">${p.used?'학생 사용 '+fmt(p.used):'미사용'}</span><span class="tag ${D.ok[key(p)]?'':'g'}">${D.ok[key(p)]?'선생님 확인 '+fmt(D.ok[key(p)]):'확인 전'}</span><div class="row"><button class="ghost" data-ok="${esc(key(p))}">${D.ok[key(p)]?'확인 취소':'지급 확인'}</button></div></div>`).join('')}<p class="muted">번호가 학생 화면과 같은지 보고, 지급한 뒤 "지급 확인"을 눌러 기록해 두세요.</p></div>`:'';
  $('#list').innerHTML=`<div class="card"><h2>학생별</h2>${L.map(o=>`<div class="st"><b>${esc(o.n)}</b> <span class="tag">${esc(o.lv)}</span><br><span class="muted">기록한 날 ${o.r}번 · 연속 ${o.st}일 (최장 ${o.lg}) · 퀘스트 ${o.q}번 · 최근 에너지 ${o.e||"-"}/4 (1 방전 ~ 4 충전) · 마지막 기록 ${o.l||'없음'} · 보고 ${fmt(o.t)}</span></div>`).join('')}</div>`;
}
const CF='jidang.teacher.cfg';let cfg={};try{cfg=JSON.parse(localStorage.getItem(CF)||'{}')}catch(e){}
$('#su').value=cfg.u||'';$('#sk').value=cfg.k||'';$('#sc').value=cfg.c||'';
const rd=()=>({u:$('#su').value.trim(),k:$('#sk').value.trim(),c:$('#sc').value.trim()});
$('#ssave').onclick=()=>{cfg=rd();try{localStorage.setItem(CF,JSON.stringify(cfg))}catch(e){}$('#smsg').textContent='저장했어요.'};
$('#sload').onclick=async()=>{
  cfg=rd();try{localStorage.setItem(CF,JSON.stringify(cfg))}catch(e){}
  if(!/^https:\/\/script\.google\.com\//.test(cfg.u)||!cfg.k){$('#smsg').textContent='주소와 비밀 키를 확인해 주세요.';return}
  $('#smsg').textContent='불러오는 중…';
  try{
    const r=await fetch(cfg.u+'?key='+encodeURIComponent(cfg.k));const j=await r.json();
    if(!j.ok){$('#smsg').textContent='불러오지 못했어요. 비밀 키를 확인해 주세요.';return}
    let n=0;for(const c of j.codes){const o=dec(c);if(!o)continue;const k=o.n+'|'+o.s;if(!D.st[k]||D.st[k].t<=o.t){D.st[k]=o;n++}}
    save();draw();$('#smsg').textContent=n+'명을 불러왔어요.';
  }catch(e){$('#smsg').textContent='연결이 안 돼요. 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'}
};
$('#slink').onclick=()=>{
  cfg=rd();if(!/^https:\/\/script\.google\.com\//.test(cfg.u)||!cfg.c){$('#smsg').textContent='웹 앱 주소와 반 코드를 먼저 적어 주세요.';return}
  const base=location.href.replace(/t-jidang\.html.*$/,'');
  const t=$('#sout');t.hidden=false;t.value=base+'#s='+encodeURIComponent(cfg.u)+'&k='+encodeURIComponent(cfg.c);t.select();
  $('#smsg').textContent='이 링크를 학생들에게 나눠 주세요. 처음 한 번 열면 연결돼요.';
};
draw();
</script></body></html>
