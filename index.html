<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지당 징검다리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Hahmlet:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 칸짜리 모바일 앱. 하늘빛 바탕에 흰 카드, 오늘의 돌과 보상은 해님 노랑으로 강조. 밝은 한 가지 테마. */
:root{
  --bg:#EEF9FB; --surface:#FFFFFF; --ink:#17323B; --muted:#58757E;
  --water:#0A7F8F; --water-soft:#D6F2F5; --lamp:#FFC83D; --pop:#FF7A59; --line:#D5EAEE;
  --e1:#BFD0D5; --e2:#86D4DC; --e3:#2FBFCC; --e4:#FFC83D;
  --c0:#FF7A59; --c1:#FFC83D; --c2:#2FBFCC; --c3:#8E7CFF;
  --display:'Jua','Hahmlet','Apple SD Gothic Neo',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{min-height:100%;background-image:linear-gradient(180deg,#CFF0F4,#EEF9FB 280px);background-repeat:no-repeat}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.02em;color:var(--water)}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(10,127,143,.08)}
.card h3{font-size:19px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px}
.tiny{font-size:13px;color:var(--muted)}
.hero h1{font-size:30px}
.hero .sub{color:var(--muted);margin-top:6px}
label,.lab{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
input[type=text],input[type=number],textarea{width:100%;background:#F6FCFD;border:2px solid var(--line);border-radius:14px;padding:11px 12px;outline:none}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--water);color:#fff;min-height:48px;box-shadow:0 4px 0 rgba(10,60,70,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(10,60,70,.18)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--water);border:2px solid var(--water);box-shadow:none}
.btn.lamp{background:var(--lamp);color:#2a1d02}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--water);text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--lamp);border-color:var(--lamp);color:#2a1d02;font-weight:600}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;width:100%;box-shadow:0 6px 18px rgba(10,127,143,.08)}
.choice b{font-family:var(--display);font-weight:400;font-size:21px}
.choice span{color:var(--muted);font-size:14px}
.choice:hover{border-color:var(--water)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;background:#fff;font-weight:500}
.seg input:checked+label{border-color:var(--water);background:var(--water-soft);font-weight:600}
.seg input:focus-visible+label{outline:3px solid var(--lamp);outline-offset:2px}
.energy{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.energy input{position:absolute;opacity:0;pointer-events:none}
.energy label{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:16px;padding:10px 4px;cursor:pointer;background:#fff;font-size:14px;font-weight:500}
.energy label i{display:block;width:34px;height:24px;border-radius:50%}
.energy .l1 i{background:var(--e1)}.energy .l2 i{background:var(--e2)}.energy .l3 i{background:var(--e3)}.energy .l4 i{background:var(--e4)}
.energy input:checked+label{border-color:var(--ink);font-weight:600;background:#F6FCFD}
.energy input:focus-visible+label{outline:3px solid var(--lamp);outline-offset:2px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.stepper input{text-align:center;font-size:22px;font-weight:600}
.err{color:#D6362B;font-size:14px;min-height:20px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(10,127,143,.07)}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:12px 0 10px;font-weight:500;color:var(--muted);cursor:pointer;border-top:4px solid transparent;font-size:14px}
.nav button[aria-current=page]{color:var(--water);font-weight:600;border-top-color:var(--lamp)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(10,127,143,.06)}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--water)}
.tile span{font-size:13px;color:var(--muted)}
svg{display:block;width:100%;height:auto}
.water{fill:var(--water-soft);opacity:.7}
.path{stroke:var(--water);stroke-opacity:.35;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.st text{font-size:11px;font-family:var(--body);text-anchor:middle;dominant-baseline:central;fill:var(--muted)}
.st ellipse{fill:none}
.s1 ellipse{fill:var(--e1)}.s2 ellipse{fill:var(--e2)}.s3 ellipse{fill:var(--e3)}.s4 ellipse{fill:var(--e4)}
.s1 text,.s2 text,.s3 text,.s4 text{fill:#17323B;font-weight:600}
.st.miss ellipse{stroke:var(--muted);stroke-opacity:.5;stroke-dasharray:3 4;stroke-width:1.5}
.st.pre{opacity:.4}
.st.pre ellipse{stroke:var(--line);stroke-width:1.5}
.st.bridge ellipse{fill:#fff;stroke:var(--water);stroke-dasharray:4 3;stroke-width:1.8}
.st.bridge text{fill:var(--water)}
.st.today ellipse.ring{fill:none;stroke:var(--pop);stroke-width:3}
.st.can{cursor:pointer}
.st.can ellipse{stroke:var(--lamp);stroke-opacity:1;stroke-dasharray:none;stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bar{fill:var(--e2)}.bar.ok{fill:var(--e3)}
.tl{stroke:var(--pop);stroke-width:2;stroke-dasharray:5 4}
.lbl{font-size:10.5px;fill:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums}
.lbl2{font-size:10.5px;fill:var(--muted);font-family:var(--body)}
.cmp{display:grid;gap:10px}
.cmp .card{padding:12px 14px;box-shadow:none;background:#F6FCFD}
.cmp small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.cmp p{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.badge span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--e3);border-radius:4px}
.badge .bar2{margin-top:8px;height:6px}
.badge.got{border-color:var(--lamp);background:linear-gradient(180deg,#fff,#FFF6D6)}
.badge.got .bar2 i{background:var(--lamp)}
.pill{background:var(--water-soft);color:var(--water);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.ms{margin:0}
.ms.got{border-color:var(--lamp);background:linear-gradient(180deg,#fff,#FFF8DD)}
.ms.got .pill{background:var(--lamp);color:#2a1d02}
.ms.got .bar2 i{background:var(--lamp)}
.lvl h2{font-size:30px}
.lvl .bar2{margin-top:8px}
.proof{margin-top:12px;border:2px dashed var(--pop);border-radius:18px;padding:14px;text-align:center;background:#FFF8F5}
.proof h2{font-size:32px;color:var(--pop)}
.mile{position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#fff,#FFF3C4)}
.mile h2{font-size:24px}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;opacity:0;animation:fall 2.4s ease-in both}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(280px) rotate(540deg);opacity:0}}
.drop{position:relative;height:120px;display:flex;align-items:center;justify-content:center}
.drop .stone{width:74px;height:50px;border-radius:50%;background:var(--e3);animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
.drop .r{position:absolute;width:74px;height:50px;border-radius:50%;border:3px solid var(--water);opacity:0;animation:ripple 1.4s .35s ease-out both}
.drop .r2{animation-delay:.6s}
@keyframes drop{from{transform:translateY(-70px) scale(1.25);opacity:0}to{transform:none;opacity:1}}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.drop .stone,.drop .r{animation:none}.drop .r,.confetti{display:none}}
.skeleton{height:14px;border-radius:7px;background:var(--line);margin:8px 0;width:80%}
.q{font-family:var(--display);font-size:18px;line-height:1.5}
.check{display:grid;gap:8px;margin:10px 0}
.check div{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#F6FCFD;font-size:15px}
.check .ok b{color:var(--water)}.check .no b{color:var(--muted);font-weight:500}
.hint{background:#FFF3C4;border-radius:14px;padding:10px 12px;font-size:14px}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--water)}
.seed{border-left:6px solid var(--lamp)}
details summary{cursor:pointer;font-weight:600}
.pre-wrap{white-space:pre-wrap}

.petcard{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#fff,#E6F7F9)}
.pet{width:112px;flex:none}
.petcard .pet svg{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.petcard .pet svg{animation:none}}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.bubble:before{content:"";position:absolute;left:-9px;top:26px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble small{color:var(--muted);font-size:12.5px;display:block}
.bubble p{font-family:var(--display);font-size:17px;line-height:1.45}
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pets input{position:absolute;opacity:0;pointer-events:none}
.pets label{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:20px;background:#fff;padding:8px 4px;cursor:pointer;font-weight:600}
.pets input:checked+label{border-color:var(--water);background:var(--water-soft)}
.pets input:focus-visible+label{outline:3px solid var(--lamp);outline-offset:2px}
.pets .pet{width:92px}
.chip.lock{opacity:.65;border-style:dashed;cursor:default;font-size:12.5px}
.friend .pet{width:150px;margin:0 auto}

.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;cursor:pointer;margin-top:8px;font-weight:500}
.opt:disabled{cursor:default}
.opt.right{border-color:#2FA866;background:#E7F8EE;font-weight:600}
.opt.wrong{border-color:#D6362B;background:#FDECEA;opacity:.85}
.qtag{display:inline-block;background:var(--water-soft);color:var(--water);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.learn{background:#FFF8DD;border-radius:14px;padding:12px 14px;margin-top:10px}
.job{text-align:center}.job h2{font-size:30px}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn3 .btn{padding:12px 6px}

.coupon{margin-top:12px;border:2px dashed var(--pop);border-radius:18px;padding:14px;text-align:center;background:#FFF8F5}
.coupon h2{font-size:28px;color:var(--pop)}
.coupon.used{opacity:.75;border-color:var(--muted);background:#F1F5F6}
.coupon.used h2{color:var(--muted);text-decoration:line-through}
.stamp{display:inline-block;margin-top:10px;border:3px solid var(--pop);color:var(--pop);border-radius:12px;padding:4px 14px;font-weight:700;transform:rotate(-4deg)}
.coupon.used .stamp{border-color:var(--muted);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" hidden aria-label="화면 이동"><div>
  <button data-act="nav" data-v="today">오늘</button>
  <button data-act="nav" data-v="change">변화</button>
  <button data-act="nav" data-v="quest">퀘스트</button>
  <button data-act="nav" data-v="reward">보상</button>
  <button data-act="nav" data-v="goal">목표</button>
</div></nav>

<script>
"use strict";
/* ---------- 도우미 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayKey=()=>ymd(new Date());
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const kdate=k=>{const d=parse(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);

/* ---------- 상태와 저장 ---------- */
const LS='jidang.v1';
let S=null, view='today', ob=null, form=null, justSaved=null;
const store={doc:null,sample:null,where:'기기'};
const blank=()=>({v:1,nick:'',goal:null,goalHistory:[],entries:{},bridges:{},used:0,start:null,updated:0,rewards:{self:{},gotSelf:{},gotTeacher:{}}});
let saveT=null, writing=false, dirty=false;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  dirty=true; clearTimeout(saveT); saveT=setTimeout(flush,500);
}
async function flush(){
  if(!store.doc||writing||!dirty)return;
  writing=true; dirty=false;
  try{await store.doc.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  finally{writing=false; if(dirty)flush()}
}
const SYNC='jidang.sync';
function syncCfg(){try{const c=JSON.parse(localStorage.getItem(SYNC)||'null');return c&&c.u&&c.k?c:null}catch(e){return null}}
function readHash(){
  try{
    const h=(location.hash||'').replace(/^#/,'');if(!h)return;
    const q=new URLSearchParams(h),u=q.get('s'),k=q.get('k');
    if(u&&k&&/^https:\/\/script\.google\.com\//.test(u)){localStorage.setItem(SYNC,JSON.stringify({u,k}));history.replaceState(null,'',location.pathname+location.search)}
  }catch(e){}
}
let sendMsg='';
async function sendReport(quiet){
  const c=syncCfg();if(!c)return false;
  try{
    await fetch(c.u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:c.k,c:reportCode()})});
    S.sentAt=Date.now();save();if(!quiet)sendMsg='보냈어요. 선생님 화면에 곧 보여요.';return true;
  }catch(e){if(!quiet)sendMsg='지금은 보낼 수 없어요. 인터넷을 확인하고 다시 눌러 주세요.';return false}
}
async function init(){
  readHash();
  try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  S=Object.assign(blank(),S||{});
  render();
  try{
    if(!window.claude||!claude.use)return;
    const [db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);
    store.sample=sample||null;
    if(db&&user){
      const id=await user.id();
      if(id){
        store.doc=db.collection('data/users/'+id).doc('jidang');
        store.where='계정';
        const snap=await withTimeout(store.doc.get(),8000);
        if(snap.exists){
          const remote=JSON.parse(JSON.stringify(snap.data()));
          if(!S.goal||(remote.updated||0)>(S.updated||0))S=Object.assign(blank(),remote);
          else {dirty=true;flush()}
        }else if(S.goal){dirty=true;flush()}
      }
    }
  }catch(e){}
  if(!ob&&!form)render();
}

/* ---------- 계산 ---------- */
const keys=()=>Object.keys(S.entries).sort();
function dayset(){const o={};keys().forEach(k=>o[k]=1);Object.keys(S.bridges).forEach(k=>{if(!o[k])o[k]=2});return o}
function streak(){const ds=dayset();let d=todayKey();if(!ds[d])d=addDays(d,-1);let n=0;while(ds[d]){n++;d=addDays(d,-1)}return n}
function longest(){const ks=Object.keys(dayset()).sort();let best=0,cur=0,prev=null;for(const k of ks){cur=(prev&&diffDays(prev,k)===1)?cur+1:1;if(cur>best)best=cur;prev=k}return best}
function comebacks(){const ks=keys();let n=0;for(let i=1;i<ks.length;i++)if(diffDays(ks[i-1],ks[i])>=2)n++;return n}
const tickets=()=>1+Math.floor(keys().length/7)-S.used;
const dayNum=(k)=>diffDays(S.start||todayKey(),k||todayKey())+1;
const unit=()=>S.goal.type==='count'?(S.goal.unit||''):'';
function total(){return keys().reduce((a,k)=>a+(Number(S.entries[k].val)||0),0)}
function badges(){
  const ks=keys(),n=ks.length,L=longest();
  const done=ks.filter(k=>S.entries[k].done).length;
  const notes=ks.filter(k=>(S.entries[k].note||'').trim().length>=20).length;
  return [
    {n:'첫 돌',d:'처음으로 오늘의 돌을 놓았어요',v:n,t:1},
    {n:'사흘 연속',d:'3일을 이어서 건넜어요',v:L,t:3},
    {n:'일주일 다리',d:'7일을 이어서 건넜어요',v:L,t:7},
    {n:'다시 돌아온 날',d:'쉬었다가 다시 돌을 놓았어요',v:comebacks(),t:1},
    {n:'약속 10번',d:'내가 정한 양을 10번 지켰어요',v:done,t:10},
    {n:'내 글 10편',d:'스무 자 이상 쓴 날이 10번이에요',v:notes,t:10},
    {n:'목표 고쳐 세우기',d:'목표를 스스로 다시 다듬었어요',v:Math.max(0,S.goalHistory.length-1),t:1},
    {n:'한 달 다리',d:'30일 동안 돌을 놓았어요',v:n,t:30},

const scrub=t=>String(t||'').replace(/0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/g,'(번호)').replace(/\S+@\S+\.\S+/g,'(메일)').slice(0,400);
async function ask(prompt){
  if(!store.sample)return null;
  try{const r=await store.sample.json(prompt,{modelTier:'quick',cache:false});return (r&&typeof r==='object')?r:null}catch(e){return null}
}
const RULES='규칙: 학생의 글이나 목표를 대신 써 주지 않는다. 훈계, 과한 칭찬, 조언 목록을 쓰지 않는다. 학생이 스스로 생각하도록 질문한다. 존댓말, 따뜻하고 짧게. 학생 이름은 모른다. JSON만 출력한다.';
function localCheck(g){
  const t=g.replace(/\s/g,'');
  return {specific:t.length>=12,measurable:/\d/.test(g),deadline:/(까지|동안|이내|주일|주간|개월|한 달|학기|방학|\d\s*월|\d\s*일)/.test(g)};
}
function localQuestion(c){
  if(!c.specific)return '정확히 무엇을 하는 건가요? 눈에 보이는 행동으로 바꿔 쓰면 어떤 모습일까요?';
  if(!c.measurable)return '하루에 얼마만큼 하면 "했다"고 말할 수 있나요? 숫자로 바꿔 볼까요?';
  if(!c.deadline)return '언제까지 해 볼 건가요? 끝나는 날이 있으면 힘이 납니다.';
  return '이 목표를 이루면 나는 지금과 어떻게 달라져 있을까요?';
}
async function checkGoal(g){
  const clean=scrub(g);
  const r=await ask(`너는 중학생이 스스로 목표를 세우도록 돕는 코치다. 학생이 쓴 목표: "${clean}"\n목표가 (1)구체적인 행동인지 (2)숫자로 셀 수 있는지 (3)기한이 있는지 판정하고, 학생이 스스로 답할 질문을 1개만 한다. ${RULES}\n형식: {"specific":true,"measurable":true,"deadline":true,"question":"40자 안팎 질문","tiny":"오늘 2분만 한다면 무엇을 할 수 있을지 묻는 질문 1개"}`);
  if(r&&typeof r.question==='string')return {specific:!!r.specific,measurable:!!r.measurable,deadline:!!r.deadline,question:r.question,tiny:r.tiny||'오늘 2분만 한다면 무엇부터 할 수 있을까요?',ai:true};
  const c=localCheck(g);
  return Object.assign(c,{question:localQuestion(c),tiny:'오늘 2분만 한다면 무엇부터 할 수 있을까요?',ai:false});
}
async function getSeeds(area,feels,note,round){
  const r=await ask(`너는 무기력하거나 목표가 막연한 중학생이 스스로 목표를 찾도록 돕는 코치다.\n학생이 끌리는 영역: ${area}\n학생의 마음: ${feels.join(', ')||'말하지 않음'}\n신경 쓰이는 것: "${scrub(note)}"\n학생이 고를 수 있는 목표 후보 3개를 제안한다. 조건: 100일 동안 매일 할 수 있을 만큼 작게 시작할 것, 구체적인 행동일 것, 숫자로 셀 수 있거나 했는지 체크할 수 있을 것, 서로 다른 방향일 것. ${round>1?'이전과는 다른 후보를 낸다. ':''}학생이 고르고 자기 말로 고치도록 돕는 질문도 1개 만든다. 훈계와 과한 칭찬은 하지 않는다. 존댓말, 따뜻하고 짧게. JSON만 출력한다.\n형식: {"seeds":[{"goal":"100일 동안 매일 ...","type":"count 또는 check","unit":"단위(check면 빈 문자열)","target":숫자(check면 0),"why":"이 목표가 좋은 이유 30자 이내"}],"question":"학생에게 하는 질문"}`);
  if(r&&Array.isArray(r.seeds)){
    const seeds=r.seeds.slice(0,3).map(x=>({goal:String(x.goal||'').slice(0,100),type:x.type==='check'?'check':'count',unit:String(x.unit||'').slice(0,6),target:Number(x.target)||0,why:String(x.why||'').slice(0,60)})).filter(x=>x.goal);
    if(seeds.length)return {ai:true,seeds,question:String(r.question||'이 중에서 마음이 조금이라도 끌리는 것이 있나요?')};
  }
  const list=SEEDS[area]||SEEDS['생활습관'],off=(((round||1)-1)*3)%list.length;
  const seeds=[0,1,2].map(i=>list[(off+i)%list.length]).map(([goal,type,unit,target,why])=>({goal,type,unit,target,why}));
  return {ai:false,seeds,question:'이 중에서 마음이 조금이라도 끌리는 것이 있나요? 끌리는 이유를 생각해 보세요.'};
}

async function feedback(day,e){
  const sk=streak(),n=keys().length;
  const r=await ask(`너는 중학생의 실천 기록을 읽는 다정한 코치다.\n목표: "${scrub(S.goal.text)}"\n오늘 기록: ${S.goal.type==='count'?`${e.val}${unit()} (약속한 양 ${S.goal.target||'-'}${unit()})`:(e.done?'했어요':'시작만 했어요')}, 에너지 ${e.energy}/4(1 방전, 4 충전), 느낀 점: "${scrub(e.note)}", 작은 승리: "${scrub(e.win)}"\n지금까지 연속 ${sk}일, 기록한 날 ${n}번.\n기록에 실제로 있는 구체적인 사실 1가지를 짚고(observe), 학생이 스스로 생각할 질문 1개(question)를 만든다. 에너지가 1이면 한 것 자체를 인정한다. ${RULES}\n형식: {"observe":"한 문장","question":"한 문장"}`);
  if(r&&r.observe&&r.question)return {observe:String(r.observe),question:String(r.question),ai:true};
  let o;
  if(e.energy===1)o='에너지가 바닥인 날에도 돌을 놓았어요.';
  else if(sk>=2)o=`${sk}일째 이어서 돌을 놓고 있어요.`;
  else if(e.done)o='오늘 약속한 만큼 해냈어요.';
  else o='목표에는 조금 못 미쳤지만, 시작한 것이 기록으로 남았어요.';
  return {observe:o,question:FALLBACK_Q[hash(day)%FALLBACK_Q.length],ai:false};
}

    ${e.win?`<p class="muted" style="margin-top:6px">작은 승리: ${esc(e.win)}</p>`:''}
    ${e.note?`<p class="pre-wrap" style="margin-top:8px">${esc(e.note)}</p>`:''}

  }
  const f=form||(form={val:e?e.val:'',done:e?(e.done?'1':'0'):'',energy:e?e.energy:0,note:e?e.note:'',win:e?e.win:''});

   ?`<label for="val">오늘 한 양 (${esc(unit())})</label><div class="stepper"><button type="button" data-act="step" data-n="-1" aria-label="하나 줄이기">−</button><input type="number" inputmode="numeric" id="val" data-form="val" min="0" value="${esc(f.val)}"><button type="button" data-act="step" data-n="1" aria-label="하나 늘리기">+</button></div>${g.target?`<div class="row" style="margin-top:8px"><button type="button" class="chip" data-act="fill">약속한 만큼 ${esc(g.target)}${esc(unit())}</button><span class="tiny">적게 해도 돌은 놓여요</span></div>`:''}`
   :`<div class="lab">오늘 실천</div><div class="seg"><input type="radio" name="done" id="d1" value="1" data-form="done" ${f.done==='1'?'checked':''}><label for="d1">했어요</label><input type="radio" name="done" id="d0" value="0" data-form="done" ${f.done==='0'?'checked':''}><label for="d0">시작만 했어요</label></div>`;

  <div><label for="win">오늘의 작은 승리 (선택)</label><input type="text" id="win" data-form="win" maxlength="60" value="${esc(f.win)}" placeholder="예: 귀찮았지만 시작했다"></div>

async function loadFeedback(){
  const t=todayKey(),e=S.entries[t],box=$('#fb');
  if(!e||!box)return;
  if(justSaved.fb){paintFb(justSaved.fb);return}
  const fb=await feedback(t,e);
  if(!justSaved)return;
  justSaved.fb=fb;paintFb(fb);
}
function paintFb(fb){
  const box=$('#fb');if(!box)return;
  box.innerHTML=`<p class="tiny">오늘의 한마디${fb.ai?' · AI 코치':''}</p><p style="margin-top:4px">${esc(fb.observe)}</p><p class="q" style="margin-top:10px">${esc(fb.question)}</p><p class="tiny" style="margin-top:8px">답은 내일의 기록에 한 줄로 써 봐도 좋아요.</p>`;
}

/* 나의 변화 */
function stonesSvg(){
  const t=todayKey(),ds=dayset(),cw=50,rh=58,W=350,H=4*rh+6;
  let pts=[],g='',tx=0,ty=0;
  const can=k=>!ds[k]&&k<t&&k>=S.start&&diffDays(k,t)<=7&&tickets()>0;
  for(let i=0;i<28;i++){
    const k=addDays(t,i-27),r=Math.floor(i/7),c=i%7,col=r%2===0?c:6-c;
    const x=25+col*cw,y=30+r*rh+((hash(k)%9)-4);
    pts.push([x,y]);if(k===t){tx=x;ty=y}
    const e=S.entries[k];
    let cls='st';
    if(e)cls+=' s'+e.energy;else if(S.bridges[k])cls+=' bridge';else if(k<S.start)cls+=' pre';else if(k<t)cls+=' miss'+(can(k)?' can':'');
    if(k===t)cls+=' today';
    const label=e?`${kdate(k)} 기록`:S.bridges[k]?`${kdate(k)} 회복권으로 이음`:can(k)?`${kdate(k)} 쉼, 회복권으로 잇기`:`${kdate(k)}`;
    g+=`<g class="${cls}" data-d="${k}" ${can(k)?'role="button" tabindex="0" data-act="bridge-ask"':''} aria-label="${label}"><ellipse cx="${x}" cy="${y}" rx="19" ry="14"/>${k===t?`<ellipse class="ring" cx="${x}" cy="${y}" rx="23" ry="18"/>`:''}<text x="${x}" y="${y}">${parse(k).getDate()}</text></g>`;
  }
  const d='M'+pts.map(p=>p.join(' ')).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="최근 28일 징검다리"><rect class="water" x="0" y="0" width="${W}" height="${H}" rx="14"/><path class="path" d="${d}"/>${g}${S.pet?`<g transform="translate(${tx-15} ${ty-40}) scale(.25)">${petInner(S.pet,petMood(),stageOf(keys().length))}</g>`:''}</svg>
  <div class="legend"><span><i style="background:var(--e1)"></i>방전</span><span><i style="background:var(--e2)"></i>느릿</span><span><i style="background:var(--e3)"></i>보통</span><span><i style="background:var(--e4)"></i>충전</span><span><i style="border:1.5px dashed var(--water)"></i>회복권</span></div>`;
}
function barChart(){
  const ks=keys().filter(k=>S.entries[k].val!==''&&S.entries[k].val!=null).slice(-14);
  if(S.goal.type!=='count'||ks.length<2)return '';
  const vals=ks.map(k=>Number(S.entries[k].val)||0),tgt=Number(S.goal.target)||0,max=Math.max(...vals,tgt,1);
  const W=350,H=160,pl=8,pb=22,pt=18,step=(W-pl*2)/ks.length,bw=Math.min(22,step-6);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  if(tgt)g+=`<line class="tl" x1="0" x2="${W}" y1="${y(tgt)}" y2="${y(tgt)}"/>`;
  ks.forEach((k,i)=>{const v=vals[i],x=pl+step*i+(step-bw)/2,yy=y(v);
    g+=`<rect class="bar ${S.entries[k].done?'ok':''}" x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,H-pb-yy)}" rx="4"/><text class="lbl" x="${x+bw/2}" y="${yy-4}" text-anchor="middle">${v}</text><text class="lbl2" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${parse(k).getDate()}</text>`});
  return `<div class="card"><h3>최근 기록한 양</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${ks.length}번 기록한 양">${g}</svg><p class="tiny" style="margin-top:6px">${tgt?`점선은 약속한 ${tgt}${esc(unit())}이고, 진한 막대는 약속을 지킨 날이에요.`:''}</p></div>`;
}
function viewChange(){
  const ks=keys(),n=ks.length,done=ks.filter(k=>S.entries[k].done).length;
  const tiles=`<div class="tiles"><div class="tile"><b>${streak()}</b><span>연속으로 건넌 날</span></div><div class="tile"><b>${n}</b><span>기록한 날</span></div><div class="tile"><b>${done}</b><span>약속을 지킨 날</span></div>${S.goal.type==='count'?`<div class="tile"><b>${total().toLocaleString('ko-KR')}</b><span>지금까지 누적 (${esc(unit())||'합계'})</span></div>`:`<div class="tile"><b>${Math.max(0,tickets())}</b><span>남은 회복권</span></div>`}</div>`;
  let energy='';
  if(n>=14){const a=avgEnergy(ks.slice(0,7)),b=avgEnergy(ks.slice(-7));energy=`<div class="card"><h3>에너지의 흐름</h3><p>처음 7번 평균 <b>${a.toFixed(1)}</b> → 최근 7번 평균 <b>${b.toFixed(1)}</b> <span class="muted">(1 방전, 4 충전)</span></p></div>`}
  const withNote=ks.filter(k=>(S.entries[k].note||'').trim());
  let cmp='';
  if(withNote.length>=2){
    const f=withNote[0],l=withNote[withNote.length-1];
    cmp=`<div class="card"><h3>내 글의 변화</h3><div class="cmp"><div class="card"><small>${dayNum(f)}일차의 나</small><p>${esc(S.entries[f].note)}</p></div><div class="card"><small>${dayNum(l)}일차의 나</small><p>${esc(S.entries[l].note)}</p></div></div>
    ${withNote.length>=5?`<div style="margin-top:12px"><button class="btn ghost" data-act="ai-change">AI에게 달라진 점 물어보기</button></div><div id="aiChange" aria-live="polite" style="margin-top:12px"></div>`:'<p class="tiny" style="margin-top:8px">글이 5편 쌓이면 AI와 함께 달라진 점을 살펴볼 수 있어요.</p>'}</div>`;
  }else cmp=`<div class="card"><h3>내 글의 변화</h3><p class="muted">글이 두 편 쌓이면 처음의 나와 지금의 나를 나란히 볼 수 있어요.</p></div>`;
  const bd=badges();
  return `<div class="stack"><div class="hero"><h1>나의 변화</h1><p class="sub">쉬는 날이 있어도 다리는 이어져요. 돌아온 날이 가장 중요한 날이에요.</p></div>
  <div class="card"><h3>최근 28일 징검다리</h3>${stonesSvg()}<div id="bridgeBox" aria-live="polite" style="margin-top:10px"></div><p class="tiny" style="margin-top:8px">회복권은 7번 기록할 때마다 1장씩 생기고, 쉬어 간 날(점선 노란 테두리)을 눌러 이어 붙일 수 있어요.</p></div>
  ${tiles}${barChart()}${energy}${cmp}
  <div class="card"><h3>내가 모은 배지</h3><div class="badges">${bd.map(b=>`<div class="badge ${b.got?'got':''}"><b>${esc(b.n)}</b><span>${esc(b.d)}</span><div class="bar2" aria-hidden="true"><i style="width:${Math.min(100,Math.round(b.v/b.t*100))}%"></i></div><span>${Math.min(b.v,b.t)} / ${b.t}${b.got?' · 달성':''}</span></div>`).join('')}</div></div></div>`;
}

    body:`<ellipse cx="36" cy="108" rx="9" ry="7" fill="${c1}"/><ellipse cx="84" cy="108" rx="9" ry="7" fill="${c1}"/><ellipse cx="60" cy="96" rx="30" ry="18" fill="${c1}"/><circle cx="60" cy="62" r="30" fill="${c1}"/>`};
  return {top:30,lx:49,rx:71,ey:58,my:0,sy:80,beak:'<ellipse cx="60" cy="69" rx="10" ry="6" fill="#FF8A3D"/>',back:'',
    body:`<ellipse cx="60" cy="88" rx="38" ry="26" fill="${c1}"/><circle cx="60" cy="58" r="28" fill="${c1}"/><path d="M57 31 Q52 20 63 23 Q60 29 65 31Z" fill="${c2}"/><ellipse cx="36" cy="92" rx="9" ry="14" fill="${c2}" opacity=".55" transform="rotate(20 36 92)"/><ellipse cx="84" cy="92" rx="9" ry="14" fill="${c2}" opacity=".55" transform="rotate(-20 84 92)"/>`};

function petEyes(c,mood){

    else if(mood==='rest')o+=`<path d="M${x-7} ${y} Q${x} ${y+6} ${x+7} ${y}" stroke="#17323B" stroke-width="3" fill="none" stroke-linecap="round"/>`;

function petMouth(c,mood){

function petItem(id,c){

    case 'phones':return `<path d="M35 ${t+24} Q35 ${t-12} 60 ${t-12} Q85 ${t-12} 85 ${t+24}" stroke="#17323B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="29" y="${t+18}" width="11" height="20" rx="5" fill="#FF7A59"/><rect x="80" y="${t+18}" width="11" height="20" rx="5" fill="#FF7A59"/>`;

    case 'blush':return heart(c.lx-8,c.ey+14)+heart(c.rx+8,c.ey+14);
    case 'cap':return `<path d="M34 ${t+6} L60 ${t-8} L86 ${t+6} L60 ${t+20}Z" fill="#17323B"/><rect x="50" y="${t+10}" width="20" height="10" fill="#17323B"/><path d="M82 ${t+6} L82 ${t+22}" stroke="#FFC83D" stroke-width="2.5"/><circle cx="82" cy="${t+24}" r="3" fill="#FFC83D"/>`;

function petInner(P,mood,st){
  const c=petBase(P.sp),eq=P.equip||{},t=c.top;
  let o=`<ellipse cx="60" cy="116" rx="32" ry="5" fill="#17323B" opacity=".1"/>`;
  if(st>=4)o+=`<circle cx="60" cy="74" r="54" fill="#FFC83D" opacity=".22"/>`;
  if(st>=3)o+=`<path d="M32 66 Q14 90 12 112 L108 112 Q106 90 88 66Z" fill="#8E7CFF" opacity=".9"/>`;
  o+=c.back+c.body;
  if(st>=2)o+=`<rect x="36" y="${c.sy}" width="48" height="9" rx="4.5" fill="#FF7A59"/><rect x="68" y="${c.sy+4}" width="9" height="16" rx="4" fill="#FF7A59"/>`;
  if(!(eq.face==='blush'))o+=`<ellipse cx="${c.lx-9}" cy="${c.ey+13}" rx="6" ry="4" fill="#FF9AA2" opacity=".5"/><ellipse cx="${c.rx+9}" cy="${c.ey+13}" rx="6" ry="4" fill="#FF9AA2" opacity=".5"/>`;
  o+=(c.beak||'')+petEyes(c,mood)+petMouth(c,mood);
  if(eq.face)o+=petItem(eq.face,c);

  if(st>=4)o+=`<path d="M44 ${t-14} L47 ${t-28} L54 ${t-18} L60 ${t-32} L66 ${t-18} L73 ${t-28} L76 ${t-14}Z" fill="#FFC83D" stroke="#E0A100" stroke-width="1.5" stroke-linejoin="round"/>`;

const petSvg=(P,mood,st)=>`<svg viewBox="0 0 120 124" role="img" aria-label="${esc(SPNAME[P.sp])} 친구">${petInner(P,mood,st)}</svg>`;

  ${d.cat==='study'?`<div class="lab" style="margin-top:12px">학년</div><div class="chips">${[1,2,3].map(g=>`<button type="button" class="chip ${d.grade===g?'on':''}" data-act="dgrade" data-v="${g}" aria-pressed="${d.grade===g}">중${g}</button>`).join('')}<button type="button" class="chip ${!d.grade?'on':''}" data-act="dgrade" data-v="" aria-pressed="${!d.grade}">섞어서</button></div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn" data-act="dream-save">꿈 저장하기</button>${S.dream?'<button class="btn ghost" data-act="dream-cancel">취소</button>':''}</div><div class="err" id="err" aria-live="polite"></div>
  <p class="tiny">아직 꿈이 없다면 아래 탐색 퀘스트부터 해 봐요. 이름 같은 개인정보는 쓰지 마세요.</p></div>`;

function viewQuest(){
  if(qs)return questSession();
  const q=Q(),t=todayKey(),log=q.log[t]||{},n=Object.keys(log).length;
  const msg=qMsg?`<div class="hint" aria-live="polite">${esc(qMsg)}</div>`:'';
  const first=!S.entries[t]?'<div class="hint">먼저 오늘의 돌(내 목표)을 놓으면 더 좋아요. 퀘스트는 그다음에 해도 충분해요.</div>':'';
  const dreamCard=(!S.dream||qEditDream)?dreamForm():`<div class="card"><p class="tiny">나의 꿈 · ${esc(CATS[S.dream.cat]||'')}${S.dream.grade?` · 중${S.dream.grade}`:''}</p><p style="font-weight:600;margin-top:2px">${esc(S.dream.text)}</p><button class="link" data-act="dream-edit">꿈 고치기</button></div>`;
  const qcard=(type,desc,off)=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${QTYPE[type]}</h3>${log[type]?'<span class="pill">오늘 완료</span>':''}</div><p class="muted" style="margin:6px 0 10px">${desc}</p>${log[type]?'':`<button class="btn" data-act="qstart" data-v="${type}" ${(off||n>=QMAX)?'disabled':''}>${n>=QMAX?'오늘은 충분해요':'시작하기'}</button>`}</div>`;
  const likes=JOBS.filter(j=>q.jobs[j.n]==='like');
  const explored=Object.keys(q.jobs).length;
  const notes=q.notes.slice(-5).reverse();
  return `<div class="stack"><div class="hero"><h1>퀘스트</h1><p class="sub">내 꿈과 살아가는 힘을 하루 5분씩 키워요. 하루 최대 ${QMAX}개만 해요.</p></div>${msg}${first}${dreamCard}
  ${qcard('dream',S.dream?'내 꿈에 도움이 되는 5분 학습이에요. 영어 한마디, 개념, 상식을 배워요.':'먼저 위에서 꿈을 적으면 열려요.',!S.dream)}
  ${qcard('life','살아가는 데 필요한 것을 5분씩 익혀요. 돈, 잠, 마음, 안전을 다뤄요.')}
  ${qcard('explore',`하루에 직업 하나를 만나 봐요. ${explored?`지금까지 ${explored}개를 만났어요.`:'꿈이 없어도 괜찮아요.'}`)}
  ${q.review.length?`<div class="card"><h3 style="margin:0">복습</h3><p class="muted" style="margin:6px 0 10px">한 번에 못 맞힌 문제 ${q.review.length}개를 다시 풀어 봐요. 하루 퀘스트 수에는 들어가지 않아요.</p><button class="btn ghost" data-act="qstart" data-v="review">복습하기</button></div>`:''}
  ${likes.length?`<div class="card"><h3>내가 끌린 직업</h3><p class="muted">누르면 내 꿈으로 정할 수 있어요.</p><div class="chips">${likes.map(j=>`<button class="chip" data-act="dream-from-job" data-n="${esc(j.n)}">${esc(j.n)}</button>`).join('')}</div></div>`:''}
  ${notes.length?`<div class="card"><h3>나의 배움 노트</h3>${notes.map(x=>`<p class="muted" style="margin-bottom:6px"><b>${kdate(x.date)}</b> ${esc(x.title)}${x.note?` · ${esc(x.note)}`:''}</p>`).join('')}</div>`:''}</div>`;

function questSession(){
  if(qs.type==='explore'){
    const j=qs.job;
    return `<div class="stack"><div class="hero"><span class="qtag">탐색 퀘스트</span><h1 style="margin-top:8px">오늘 만난 직업</h1></div>
    <div class="card job"><h2>${esc(j.n)}</h2><p style="margin-top:8px">${esc(j.d)}</p></div>
    <div class="card"><div class="lab">이 직업, 어떤가요?</div><div class="btn3"><button class="btn lamp" data-act="jobr" data-v="like">끌려요</button><button class="btn ghost" data-act="jobr" data-v="ok">보통이에요</button><button class="btn ghost" data-act="jobr" data-v="no">별로예요</button></div></div>
    <button class="link" data-act="qexit">나가기</button></div>`;
  }
  const it=qs.item,done=qs.right!==null;
  const opts=qs.opts.map((o,i)=>{
    let cls='',tag='';
    if(qs.wrong.includes(i)){cls='wrong';tag=' · 다시 생각해 봐요'}
    if(done&&i===qs.ans){cls='right';tag=' · 정답'}
    return `<button class="opt ${cls}" data-act="qans" data-i="${i}" ${(done||qs.wrong.includes(i))?'disabled':''}>${esc(o)}${tag}</button>`;
  }).join('');
  const hint=(!done&&qs.wrong.length===1)?`<div class="hint" style="margin-top:10px">힌트: ${esc(it.hint)}</div>`:'';
  const after=done?`<div class="learn" aria-live="polite"><b>${qs.right==='first'?'한 번에 맞혔어요!':qs.right==='retry'?'다시 생각해서 맞혔어요!':'정답을 같이 확인해요.'}</b><br>${esc(it.exp)}</div>
    <label for="qnote" style="margin-top:14px">오늘 배운 것을 내 말로 한 줄 (선택)</label><input type="text" id="qnote" maxlength="60" placeholder="예: went는 go의 과거형이다"><button class="btn lamp block" style="margin-top:14px" data-act="qdone">퀘스트 마치기</button>`:'';
  const aiBtn=(qs.type==='dream'&&store.sample&&!qs.ai&&!done)?`<button class="link" data-act="qai" ${qs.busy?'disabled':''}>${qs.busy?'만드는 중…':'내 꿈에 맞춰 AI가 새로 만들기'}</button>`:'';
  return `<div class="stack"><div class="hero"><span class="qtag">${QTYPE[qs.type]}${qs.ai?' · AI':''}</span><h1 style="margin-top:8px">${esc(it.t)}</h1></div>
  <div class="card"><div class="learn" style="margin-top:0">${esc(it.learn)}</div><p class="q" style="margin-top:14px">${esc(it.q)}</p>${opts}${hint}${after}</div>
  ${qs.aiFail?'<p class="tiny">AI가 지금은 어려워서 준비된 문제로 계속해요.</p>':''}
  <div class="row" style="justify-content:space-between">${aiBtn}${qs.ai&&!qs.reported?'<button class="link" data-act="qreport">내용이 이상해요</button>':''}${qs.reported?'<span class="tiny">알려 주셔서 고마워요. 선생님께 확인을 부탁해 보세요.</span>':''}<button class="link" data-act="qexit">나가기</button></div>
  ${qs.ai?'<p class="tiny">AI가 만든 내용은 틀릴 수 있어요. 이상하면 꼭 확인해 보세요.</p>':''}</div>`;
}

let couponConfirm=null;
function couponBlock(m,gs){
  const c=S.rewards.coupons&&S.rewards.coupons[m.d];
  const selfBtn=`<button class="chip ${gs?'on':''}" data-act="got" data-k="gotSelf" data-d="${m.d}" aria-pressed="${gs}">나에게 보상 줬어요</button>`;
  if(!c)return `<div class="row" style="margin-top:12px"><button class="btn lamp" data-act="coupon-issue" data-d="${m.d}">선생님 쿠폰 받기</button>${selfBtn}</div>`;
  const used=!!c.usedAt;
  const fmt=ts=>{const d=new Date(ts);return kdate(ymd(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
  const act=used?`<p class="stamp">사용 완료 · ${fmt(c.usedAt)}</p>`
    :(couponConfirm===m.d?`<p class="hint" style="margin-top:8px">선생님 앞에서 눌러 주세요. 누르면 되돌릴 수 없어요.</p><div class="row" style="margin-top:8px;justify-content:center"><button class="btn" data-act="coupon-use" data-d="${m.d}">지금 사용하기</button><button class="btn ghost" data-act="coupon-cancel">취소</button></div>`
    :`<button class="btn ghost" style="margin-top:10px" data-act="coupon-ask" data-d="${m.d}">선생님께 사용하기</button>`);
  return `<div class="coupon ${used?'used':''}"><p class="tiny">지당 프로젝트 쿠폰</p><h2>${esc(m.teacher)}</h2><p><b>${esc(S.nick)}</b> · ${m.d}일 달성 (${kdate(keys()[m.d-1]||todayKey())})</p><p class="muted">번호 ${esc(c.serial)} · 발급 ${fmt(c.issuedAt)}</p>${act}</div><div class="row" style="margin-top:10px">${selfBtn}</div>`;
}
function viewReward(){
  const n=keys().length,lv=level(n),nl=nextLevel(n);
  const pct=nl?Math.round((n-lv.n)/(nl.n-lv.n)*100):100;
  const lvCard=`<div class="card lvl"><p class="tiny">나의 칭호</p><h2>${esc(lv.name)}</h2><div class="bar2" aria-hidden="true"><i style="width:${pct}%"></i></div><p class="muted" style="margin-top:6px">${nl?`다음 칭호 "${esc(nl.name)}"까지 ${nl.n-n}번`:'가장 높은 칭호예요'}</p></div>`;
  const ladder=MILES.map(m=>{
    const reached=n>=m.d,gs=!!S.rewards.gotSelf[m.d],gt=!!S.rewards.gotTeacher[m.d];
    return `<div class="card ms ${reached?'got':''}"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${m.d}일 달성</h3><span class="pill">${reached?'달성':`${m.d-n}번 남음`}</span></div>
    <div class="bar2" style="margin-top:10px" aria-hidden="true"><i style="width:${Math.min(100,Math.round(n/m.d*100))}%"></i></div>
    <label for="sr${m.d}" style="margin-top:14px">나에게 주는 보상</label><input type="text" id="sr${m.d}" list="ideas" data-selfr="${m.d}" maxlength="40" value="${esc(S.rewards.self[m.d]||'')}" placeholder="예: 좋아하는 간식 먹기">
    <p class="muted" style="margin-top:10px"><b>선생님 보상</b> ${esc(m.teacher)}</p>
    ${reached?couponBlock(m,gs):''}</div>`;
  }).join('');
  return `<div class="stack"><div class="hero"><h1>보상</h1><p class="sub">기록한 날이 쌓일 때마다 열려요. 연속이 아니어도 괜찮아요. 쉬었다가 돌아와도 계속 쌓입니다.</p></div>${friendSection()}${lvCard}${ladder}<datalist id="ideas">${SELF_IDEAS.map(i=>`<option value="${i}"></option>`).join('')}</datalist></div>`;
}

/* 목표 */
function reportCode(){
  const ks=keys(),q=Q();
  const last7=ks.slice(-7).map(k=>S.entries[k].energy).filter(x=>typeof x==='number');
  const o={n:S.nick,s:S.start,r:ks.length,st:streak(),lg:longest(),lv:level(ks.length).name,q:(q.stats&&q.stats.done)||0,
    e:last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length*10)/10:0,l:ks.length?ks[ks.length-1]:'',
    c:Object.keys((S.rewards&&S.rewards.coupons)||{}).map(d=>[Number(d),S.rewards.coupons[d].serial,S.rewards.coupons[d].issuedAt,S.rewards.coupons[d].usedAt||0]),t:Date.now()};
  return 'JD1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}

/* ---------- 동작 ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ob&&ob){ob[t.dataset.ob]=t.value;if(t.dataset.ob==='goal')ob.check=null}
  if(t.dataset.form&&form){form[t.dataset.form]=t.dataset.form==='energy'?Number(t.value):t.value}
  if(t.dataset.auto){S.autoSend=t.checked;save()}
  if(t.dataset.nick){S.nick=t.value.trim().slice(0,12)||S.nick;save()}
  if(t.dataset.selfr){S.rewards.self[t.dataset.selfr]=t.value.slice(0,40);save()}
  if(t.dataset.dream&&dreamDraft){dreamDraft[t.dataset.dream]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ob==='type'&&ob){ob.type=t.value;render()}
  if(t.dataset.form==='energy'){const lo=$('#lowE');if(lo)lo.hidden=Number(t.value)!==1}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act="bridge-ask"]')){e.preventDefault();act('bridge-ask',e.target)}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b)act(b.dataset.act,b);
});
function err(m){const x=$('#err');if(x)x.textContent=m}
async function act(a,b){
  if(a==='nav'){view=b.dataset.v;qs=null;if(view!=='quest')qMsg='';justSaved=view==='today'?justSaved:null;render();window.scrollTo(0,0);return}
  if(a==='chip'){ob[b.dataset.f]=b.dataset.v;const i=$('#'+b.dataset.f);if(i)i.value=b.dataset.v;return}
  if(a==='ob-back'){ob.step=1;render();return}
  if(a==='ob-check'){
    const g=ob.goal.trim();if(g.length<4){err('목표를 먼저 적어 주세요.');return}
    ob.busy=true;render();ob.check=await checkGoal(g);ob.busy=false;render();return;
  }
  if(a==='ob-next'){
    if(ob.step===0){const n=ob.nick.trim();if(!n){err('별명을 적어 주세요.');return}ob.nick=n;ob.step=1;render();window.scrollTo(0,0);return}
    if(ob.step===1){if(ob.goal.trim().length<4){err('목표를 적어 주세요. 짧아도 괜찮아요.');return}ob.step=2;render();window.scrollTo(0,0);return}
  }
  if(a==='ob-done'){
    if(ob.type==='count'&&!(Number(ob.target)>0)){err('하루 약속한 양을 숫자로 적어 주세요.');return}
    const t=todayKey(),text=ob.goal.trim();
    const prev=S.goal&&S.goal.text;
    S.nick=ob.nick.trim()||S.nick;
    S.goal={origin:ob.origin||'self',text,type:ob.type,unit:ob.type==='count'?ob.unit.trim():'',target:ob.type==='count'?Number(ob.target):0,plan:{when:ob.when.trim(),where:ob.where.trim(),what:ob.what.trim()}};
    if(!S.start)S.start=t;
    if(prev!==text)S.goalHistory.push({date:t,text});
    save();form=null;view='today';if(!S.pet&&!ob.edit){ob.step=3;render();window.scrollTo(0,0);return}ob=null;render();window.scrollTo(0,0);return;
  }
  if(a==='ob-mode'){ob.mode=b.dataset.v;render();window.scrollTo(0,0);return}
  if(a==='area'){ob.area=b.dataset.v;ob.seeds=null;ob.round=0;render();return}
  if(a==='feel'){const v=b.dataset.v;ob.feel=ob.feel.includes(v)?ob.feel.filter(x=>x!==v):ob.feel.concat(v);render();return}
  if(a==='seed-get'){
    if(!ob.area){err('끌리는 영역을 하나 골라 주세요.');return}
    ob.seedBusy=true;ob.round=(ob.round||0)+1;render();
    const r=await getSeeds(ob.area,ob.feel,ob.note,ob.round);
    if(!ob)return;ob.seeds=r;ob.seedBusy=false;render();return;
  }
  if(a==='seed-pick'){
    const x=ob.seeds.seeds[Number(b.dataset.i)];if(!x)return;
    ob.goal=x.goal;ob.type=x.type;ob.unit=x.unit;ob.target=x.target||'';ob.origin=ob.seeds.ai?'ai':'template';ob.mode='self';ob.check=null;render();window.scrollTo(0,0);return;
  }
  if(a==='got'){const m=S.rewards[b.dataset.k];m[b.dataset.d]=!m[b.dataset.d];save();render();return}
  if(a==='coupon-issue'){
    const d=Number(b.dataset.d),m=MILES.find(x=>x.d===d);
    if(!m||keys().length<d)return;
    S.rewards.coupons=S.rewards.coupons||{};
    if(!S.rewards.coupons[d]){S.rewards.coupons[d]={serial:`JD-${d}-${String(hash(S.nick+'|'+d+'|'+S.start)%9000+1000)}`,issuedAt:Date.now(),usedAt:0};save()}
    render();return;
  }
  if(a==='coupon-ask'){couponConfirm=Number(b.dataset.d);render();return}
  if(a==='coupon-cancel'){couponConfirm=null;render();return}
  if(a==='coupon-use'){
    const c=S.rewards.coupons&&S.rewards.coupons[b.dataset.d];
    if(c&&!c.usedAt){c.usedAt=Date.now();couponConfirm=null;save()}
    render();return;
  }
  if(a==='pet-start'){startOb(true);ob.step=3;render();window.scrollTo(0,0);return}
  if(a==='pet-done'){
    const sp=ob.sp||'frog';
    S.pet={sp,name:(ob.pname||'').trim()||DEFNAME[sp],equip:{head:'',face:''},codes:{}};
    save();ob=null;view='today';render();window.scrollTo(0,0);return;
  }
  if(a==='equip'){S.pet.equip[b.dataset.slot]=b.dataset.item;save();render();return}
  if(a==='code'){
    const v=CODE_H(($('#code').value||'').trim().toUpperCase());
    if(!TEACHER_CODES[v])friendMsg='없는 코드예요. 쪽지를 다시 확인해 주세요.';
    else if(S.pet.codes[v])friendMsg='이미 받은 코드예요.';
    else{S.pet.codes[v]=1;friendMsg=`"${TEACHER_CODES[v]}"을(를) 받았어요! 위에서 꾸며 보세요.`;save()}
    render();return;
  }
  if(a==='qstart'){startQuest(b.dataset.v);qMsg='';render();window.scrollTo(0,0);return}
  if(a==='qexit'){qs=null;render();return}
  if(a==='qans'){
    const i=Number(b.dataset.i);
    if(!qs||qs.right!==null||qs.wrong.includes(i))return;
    if(i===qs.ans)qs.right=qs.wrong.length===0?'first':'retry';
    else{qs.wrong.push(i);if(qs.wrong.length>=2)qs.right='reveal'}
    render();return;
  }
  if(a==='qai'){
    qs.busy=true;render();
    const it=await aiLesson();
    if(!qs)return;
    qs.busy=false;
    if(it){qs.item=it;Object.assign(qs,shuffled(it),{wrong:[],right:null,ai:true,aiFail:false})}else qs.aiFail=true;
    render();return;
  }
  if(a==='qreport'){Q().reports++;qs.reported=true;save();render();return}
  if(a==='qdone'){
    if(qs.type==='review'){const rq=Q(),it=rq.review.shift();if(qs.right!=='first'&&it)rq.review.push(it);qMsg=qs.right==='first'?'복습 완료! 이제 잘 기억하고 있어요.':'다시 한 번 살펴봤어요. 나중에 또 만나요.';qs=null;save();render();window.scrollTo(0,0);return}
    const q=Q(),t=todayKey(),bb=badges().filter(x=>x.got).map(x=>x.n),ii=S.pet?itemsOwned():[];
    q.log[t]=q.log[t]||{};q.log[t][qs.type]=1;q.stats.done++;if(qs.right==='first')q.stats.right++;
    q.ptr[qs.key]=(q.ptr[qs.key]||0)+1;
    if(qs.right!=='first'){if(!q.review.some(r=>r.t===qs.item.t))q.review.push(qs.item);if(q.review.length>20)q.review.shift()}
    const note=(($('#qnote')||{}).value||'').trim().slice(0,100);
    q.notes.push({date:t,type:qs.type,title:qs.item.t,note});if(q.notes.length>60)q.notes=q.notes.slice(-60);
    finishQuest(bb,ii);return;
  }
  if(a==='jobr'){
    const q=Q(),t=todayKey(),bb=badges().filter(x=>x.got).map(x=>x.n),ii=S.pet?itemsOwned():[];
    q.jobs[qs.job.n]=b.dataset.v;q.jobPtr++;q.log[t]=q.log[t]||{};q.log[t].explore=1;q.stats.done++;
    finishQuest(bb,ii);return;
  }
  if(a==='dcat'){dreamDraft.cat=b.dataset.v;render();return}
  if(a==='dgrade'){dreamDraft.grade=b.dataset.v?Number(b.dataset.v):0;render();return}
  if(a==='dream-edit'){qEditDream=true;dreamDraft=null;render();return}
  if(a==='dream-cancel'){qEditDream=false;dreamDraft=null;render();return}
  if(a==='dream-save'){
    const d=dreamDraft||{};
    if((d.text||'').trim().length<2){err('꿈을 적어 주세요.');return}
    if(!d.cat){err('가까운 분야를 골라 주세요.');return}
    S.dream={text:d.text.trim(),cat:d.cat,grade:d.cat==='study'&&d.grade?Number(d.grade):0};dreamDraft=null;qEditDream=false;qMsg='꿈을 적었어요. 이제 꿈 퀘스트를 할 수 있어요!';save();render();return;
  }
  if(a==='dream-from-job'){const j=JOBS.find(x=>x.n===b.dataset.n);if(j){S.dream={text:j.n+' 되기',cat:j.c,from:'explore'};qMsg='"'+j.n+' 되기"를 내 꿈으로 정했어요.';save();render()}return}
  if(a==='step'){const i=$('#val');const v=Math.max(0,(Number(i.value)||0)+Number(b.dataset.n));i.value=v;form.val=String(v);return}
  if(a==='fill'){const i=$('#val');i.value=S.goal.target;form.val=String(S.goal.target);return}
  if(a==='save-today'){
    const g=S.goal;
    if(g.type==='count'&&(form.val===''||Number(form.val)<0)){err('오늘 한 양을 적어 주세요. 0도 괜찮아요.');return}
    if(g.type==='check'&&form.done===''){err('오늘 실천을 골라 주세요.');return}
    if(!form.energy){err('지금 내 에너지를 골라 주세요.');return}
    const t=todayKey(),before=badges().filter(x=>x.got).map(x=>x.n),n0=keys().length,lv0=level(n0).name,st0=stageOf(n0),it0=S.pet?itemsOwned():[],lastK=keys().filter(k=>k<t).pop();
    const val=g.type==='count'?Number(form.val):null;
    const done=g.type==='count'?(g.target?val>=g.target:val>0):form.done==='1';
    S.entries[t]={val,done,energy:form.energy,note:form.note.trim(),win:form.win.trim(),ts:Date.now()};
    save();
    const after=badges().filter(x=>x.got).map(x=>x.n);
    const n1=keys().length;
    justSaved={newBadges:after.filter(n=>!before.includes(n)),mile:n1>n0?(MILES.find(m=>m.d===n1)||null):null,title:level(n1).name!==lv0?level(n1).name:null,evo:(S.pet&&stageOf(n1)>st0)?STAGES[stageOf(n1)]:null,back:!!lastK&&diffDays(lastK,t)>=2,newItems:S.pet?itemsOwned().filter(id=>!it0.includes(id)).map(id=>ITEMS.find(i=>i.id===id).name):[],fb:null};
    form=null;render();window.scrollTo(0,0);
    if(S.autoSend&&syncCfg())sendReport(true);
    return;
  }
  if(a==='edit-today'){justSaved=null;const e=S.entries[todayKey()];form={val:e.val==null?'':e.val,done:e.done?'1':'0',energy:e.energy,note:e.note||'',win:e.win||''};render();return}
  if(a==='copy'||a==='copy-all'){
    const text=a==='copy'?entryText(b.dataset.d):keys().slice().reverse().map(entryText).join('\n\n----------\n\n');
    let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
    const m=$('#copyMsg');
    if(ok){if(m)m.textContent='복사했어요. 원하는 곳에 붙여 넣어 보세요.'}
    else{const ta=$('#copyArea');if(ta){ta.hidden=false;ta.value=text;ta.rows=8;ta.focus();ta.select()}if(m)m.textContent='자동 복사가 안 돼요. 아래 글을 길게 눌러 직접 복사해 주세요.'}
    return;
  }
  if(a==='rep-send'){sendMsg='보내는 중…';render();await sendReport();render();return}
  if(a==='rep-copy'){
    const text=reportCode();let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
    const m=$('#repMsg');
    if(ok){if(m)m.textContent='복사했어요. 선생님께 붙여 넣어 보내 주세요.'}
    else{const ta=$('#repArea');if(ta){ta.hidden=false;ta.value=text;ta.rows=4;ta.focus();ta.select()}if(m)m.textContent='자동 복사가 안 돼요. 아래 코드를 길게 눌러 복사해 주세요.'}
    return;
  }
  if(a==='edit-goal'){startOb(true);render();window.scrollTo(0,0);return}
  if(a==='bridge'){doBridge(b.dataset.d);return}
  if(a==='bridge-ask'){
    const d=b.dataset.d,box=$('#bridgeBox');
    box.innerHTML=`<div class="hint">${kdate(d)}은 쉬어 갔어요. 회복권 1장으로 이어 붙일까요? (남은 회복권 ${tickets()}장)<div class="row" style="margin-top:8px"><button class="btn" data-act="bridge" data-d="${d}">이어 붙이기</button><button class="btn ghost" data-act="bridge-close">닫기</button></div></div>`;
    return;
  }
  if(a==='bridge-close'){$('#bridgeBox').innerHTML='';return}
  if(a==='ai-change'){
    const box=$('#aiChange');box.innerHTML='<div class="skeleton"></div><div class="skeleton" style="width:60%"></div>';
    const ks=keys().filter(k=>(S.entries[k].note||'').trim());
    const pick=ks.slice(0,3).concat(ks.slice(-3)).map(k=>`${dayNum(k)}일차: "${scrub(S.entries[k].note)}" (에너지 ${S.entries[k].energy}${S.entries[k].val!=null?`, 양 ${S.entries[k].val}`:''})`).join('\n');
    const r=await ask(`너는 중학생의 실천 기록을 함께 돌아보는 코치다. 목표: "${scrub(S.goal.text)}"\n처음 3편과 최근 3편의 기록:\n${pick}\n기록에 실제로 있는 근거만 써서 달라진 점을 1~3가지 짚고(changes, 각 한 문장), 학생이 스스로 답할 질문 1개를 만든다. 근거가 약하면 억지로 만들지 않는다. ${RULES}\n형식: {"changes":["..."],"question":"..."}`);
    if(r&&Array.isArray(r.changes)&&r.question){box.innerHTML=`<p class="tiny">AI 코치가 본 달라진 점</p><ul style="margin:6px 0 0;padding-left:20px">${r.changes.slice(0,3).map(c=>`<li>${esc(c)}</li>`).join('')}</ul><p class="q" style="margin-top:10px">${esc(r.question)}</p>`}
    else box.innerHTML='<p class="muted">지금은 AI를 사용할 수 없어요. 위의 두 글을 나란히 읽고, 달라진 점을 내 말로 한 줄 적어 보세요.</p>';
    return;
  }
  if(a==='reset'){$('#resetBox').innerHTML=`<p>정말 모두 지울까요?</p><div class="row" style="margin-top:8px"><button class="btn" data-act="reset-yes">네, 지울게요</button><button class="btn ghost" data-act="reset-no">아니요</button></div>`;return}
  if(a==='reset-no'){$('#resetBox').innerHTML='';return}
  if(a==='reset-yes'){S=blank();ob=null;form=null;justSaved=null;view='today';save();render();return}
}
function finishQuest(bb,ii){
  const nb=badges().filter(x=>x.got&&!bb.includes(x.n)).map(x=>x.n);
  const ni=S.pet?itemsOwned().filter(id=>!ii.includes(id)).map(id=>ITEMS.find(i=>i.id===id).name):[];
  qMsg='퀘스트를 마쳤어요!'+(nb.length?` 새 배지: ${nb.join(', ')}.`:'')+(ni.length?` 새 꾸미기: ${ni.join(', ')}.`:'');
  qs=null;save();render();window.scrollTo(0,0);
}
function doBridge(d){
  if(tickets()<=0||S.entries[d]||S.bridges[d])return;
  S.bridges[d]=1;S.used++;save();render();
}
init();
</script>
</body>
</html>
